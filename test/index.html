66L-15%200Z%22%2F%3E%3Cpath%20d%3D%22m-45-45%2045%2032%2045-32L13%200l32%2045L0%2013l-45%2032L-13%200Z%22%2F%3E%3C%2Fg%3E%0A%3Cg%20transform%3D%22translate%28310%20650%29%20rotate%2812%29%22%20opacity%3D%22.35%22%3E%3Crect%20width%3D%22195%22%20height%3D%22122%22%20rx%3D%224%22%20fill%3D%22%23F5F0E7%22%20fill-opacity%3D%22.1%22%20stroke%3D%22%23B89255%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22m0%200%2098%2076L195%200M0%20122l69-64m126%2064-69-64%22%20stroke%3D%22%23B89255%22%20stroke-width%3D%222%22%2F%3E%3C%2Fg%3E%0A%3C%2Fsvg%3E"),linear-gradient(135deg,#252522 0%,#651F32 45%,#651F32 100%);background-position:center top;background-size:100% 100%,100% auto,100% 100%;background-repeat:no-repeat}

</style></head><body><main id="app"></main><script>const qs=[["Какой пример ближе к квесту?",["Викторина на исторические даты","Участники исследуют исчезновение хранителя по письмам и свидетельствам","Соревнование по сбору кодов"],1,"Во втором случае есть история и действия участников, двигающие её вперёд."],["Из чего состоит квест?",["Сюжет, путь игрока, связанные задания и цель","Костюмы, музыка, таймер и награда","Маршрут, викторина, баллы и приз"],0,"В основе квеста сюжет, путь игрока, логически связанные задания и конкретная цель."],["В каком варианте задание естественно встроено в историю?",["«Сложите цифры и идите к следующей точке»","Из дневника: «Мария была у башни утром, хотя по журналу её открыли вечером. Ключ всё ещё у Марии…»","Отдельный ребус без связи с историей"],1,"Запись в дневнике позволяет самому заметить противоречие и продолжить исследование."],["Что точнее передаёт путь игрока?",["Пять адресов на карте","Пять обязательных остановок","Последовательность открытий, меняющая понимание событий"],2,"Путь игрока связан не только с перемещением, но и с развитием понимания истории."],["Где сформулирована конкретная цель?",["Посетить все залы","Установить, куда исчезла реликвия, и вернуть её","Узнать интересные факты о замке"],1,"Цель определяет, ради какого результата участники действуют."],["В каком случае человек действует внутри истории?",["Отвечает экскурсоводу на вопросы о датах","Запоминает факты для викторины","Проверяет свидетельства и самостоятельно выбирает версию"],2,"В последнем случае участник становится действующим лицом истории."],["Какое действие продвигает сюжет?",["Сравнение писем раскрывает обман свидетеля","Отвлечённый пазл не приносит новых сведений","Задание на скорость приносит дополнительные баллы"],0,"Задание должно влиять на понимание происходящего или развитие истории."],["Что отличает квест от цифровой прогулки с вопросами?",["Наличие карты и таймера","Сведения на точках влияют на дальнейшее расследование","Возможность набрать баллы"],1,"Важна логическая связь действий и истории, а не технология."],["Где знание становится личным открытием?",["Прослушать лекцию","Пересказать прочитанное","Самостоятельно сопоставить документы и найти противоречие"],2,"Самостоятельное исследование превращает информацию в личный опыт."],["Какой финал соответствует цели найти пропавшего человека?",["Получить диплом без ответа","Установить события, найти человека и понять причину исчезновения","Заработать баллы, оставив историю незавершённой"],1,"Финал должен вытекать из цели, а не быть посторонней наградой."]];let i=-1,a=Array(qs.length).fill(null);const root=document.getElementById('app');const enc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){if(i<0){root.innerHTML='<p class="label">Квестомания</p><h1>Тест на квестомана</h1><p>10 ситуаций, чтобы проверить, насколько хорошо вы понимаете квесты.</p><p>Без регистрации. В конце получите результат и разбор ответов.</p><button id="start">Начать тест</button>';document.getElementById('start').onclick=()=>{i=0;draw()};return}if(i<qs.length){let q=qs[i];root.innerHTML='<p class="label">Вопрос '+(i+1)+' из '+qs.length+'</p><div class="bar"><span style="width:'+((i+1)/qs.length*100)+'%"></span></div><h2>'+enc(q[0])+'</h2><div class="choices">'+q[1].map((v,j)=>'<button data-j="'+j+'" aria-pressed="'+(a[i]===j)+'">'+enc(v)+'</button>').join('')+'</div><div class="actions"><button class="secondary" id="back">Назад</button><button id="next" '+(a[i]===null?'disabled':'')+'>'+(i===qs.length-1?'Результат':'Далее')+'</button></div>';root.querySelectorAll('[data-j]').forEach(el=>el.onclick=()=>{a[i]=+el.dataset.j;draw()});document.getElementById('back').onclick=()=>{i--;draw()};document.getElementById('next').onclick=()=>{i++;draw()};return}const n=qs.reduce((p,q,j)=>p+(a[j]===q[2]),0);root.innerHTML='<p class="label">Результат</p><h1>'+n+' из '+qs.length+'</h1><p>Посмотрите разбор ответов и попробуйте ещё раз, если захотите.</p><div class="actions"><button id="share">Поделиться результатом</button><button class="secondary" id="reset">Пройти ещё раз</button></div><p id="status" aria-live="polite"></p><p><a href="../#lessons">Вернуться к «Азбуке квеста»</a></p><h2>Разбор ответов</h2>'+qs.map((q,j)=>'<div class="review"><h3>'+(j+1)+'. '+enc(q[0])+'</h3><p>Ваш ответ: '+enc(q[1][a[j]])+(a[j]===q[2]?' ✓':'')+'</p><p>Верный ответ: '+enc(q[1][q[2]])+'</p><p>'+enc(q[3])+'</p></div>').join('');document.getElementById('reset').onclick=()=>{a=Array(qs.length).fill(null);i=-1;draw();scrollTo(0,0)};document.getElementById('share').onclick=async()=>{const msg='Я прошёл(ла) «Тест на квестомана»: '+n+' из '+qs.length+'!';try{if(navigator.share)await navigator.share({title:'Тест на квестомана',text:msg,url:location.href});else{await navigator.clipboard.writeText(msg+' '+location.href);document.getElementById('status').textContent='Результат и ссылка скопированы.'}}catch(e){if(e.name!=='AbortError')document.getElementById('status').textContent=msg+' '+location.href}}}draw();</script></body></html>
